# PHASE 5 TIER-0: Docker Compose Configuration
# Complete stack with backend and frontend

version: '3.8'

services:
  # =========================================
  # Backend API Service
  # =========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emotion-voice-backend
    ports:
      - "8000:8000"
    environment:
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=False
      - WORKERS=1
      
      # Security Configuration
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - API_TOKEN=${API_TOKEN:-your-secret-token-change-me}
      - ENABLE_AUTH=${ENABLE_AUTH:-False}
      - RATE_LIMIT=100/minute
      
      # Model Configuration
      - MODEL_PATH=/app/models/best_model.pt
      - DEVICE=auto
      - ENABLE_MODEL_PRELOAD=True
      
      # Logging Configuration
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=10485760
      - LOG_BACKUP_COUNT=5
      
      # Performance Configuration
      - MAX_FILE_SIZE_MB=50
      - ASYNC_THRESHOLD_MB=1
      - ENABLE_CACHE=True
    volumes:
      # Mount model directory (adjust path to your model location)
      - ./phase3_outputs/final_export:/app/models:ro
      # Mount logs directory for persistence
      - ./backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - emotion-voice-network

  # =========================================
  # Frontend Service (Optional)
  # =========================================
  frontend:
    build:
      context: ./frontend/Voice-Emotion-Detector
      dockerfile: Dockerfile
    container_name: emotion-voice-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - emotion-voice-network

networks:
  emotion-voice-network:
    driver: bridge

volumes:
  model-data:
  logs-data:

